name: continuous integration

on:
  push:
    branches: [main, feat/*]
    tags:
      - v*
  pull_request:
      branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A tag builds the release asset, so it starts without the npm cache that runs on
      # other refs write. zizmor can't evaluate the expression that turns it off.
      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: ${{ github.ref_type != 'tag' && 'npm' || '' }} # zizmor: ignore[cache-poisoning]
          package-manager-cache: false
      - name: install dependencies
        run: |
          npm install
          cd backend
          npm install
          sudo npm install -g @angular/cli
      - name: Set hash
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
      - name: create-json
        id: create-json
        uses: jsdaniell/create-json@938ec496e0f6d88bccb05409cbc40a23a7697337 # v1.2.4
        with:
          name: "version.json"
          json: '{"type": "autobuild", "tag": "N/A", "commit": "${{ steps.vars.outputs.sha_short }}", "date": "${{ steps.date.outputs.date }}"}'
          dir: 'backend/'
      - name: build
        run: npm run build
      - name: prepare artifact upload
        shell: pwsh
        run: |
          New-Item -Name build -ItemType Directory
          New-Item -Path build -Name ytdl-material -ItemType Directory
          Copy-Item -Path ./backend/appdata -Recurse -Destination ./build/ytdl-material
          Copy-Item -Path ./backend/audio -Recurse -Destination ./build/ytdl-material
          Copy-Item -Path ./backend/authentication -Recurse -Destination ./build/ytdl-material
          Copy-Item -Path ./backend/public -Recurse -Destination ./build/ytdl-material
          Copy-Item -Path ./backend/subscriptions -Recurse -Destination ./build/ytdl-material
          Copy-Item -Path ./backend/video -Recurse -Destination ./build/ytdl-material
          New-Item -Path ./build/ytdl-material -Name users -ItemType Directory
          Copy-Item -Path ./backend/*.js -Destination ./build/ytdl-material
          Copy-Item -Path ./backend/*.json -Destination ./build/ytdl-material
      - name: upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ytdl-material
          path: build
  # Nothing is released until the image passes a vulnerability scan: the release job
  # waits for this one, and docker-release.yml, which pushes the image, runs once the
  # release exists. Container Scan checks the published images daily against the same
  # threshold.
  image-scan:
    runs-on: ubuntu-latest
    if: contains(github.ref, '/tags/v')
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: setup docker build
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The linux/amd64 image, loaded into the runner's image store. It reads the nightly
      # builds' layer cache, the one a tag can read, and writes none.
      - name: build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: ytdl-material:scan
          cache-from: type=gha,scope=docker-main
      # Fails on high or critical vulnerabilities that have a fix. Reviewed exceptions
      # go in .grype.yaml.
      - name: scan the image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: docker:ytdl-material:scan
          severity-cutoff: high
          only-fixed: true
          output-format: table
  release:
    runs-on: ubuntu-latest
    needs: [build, image-scan]
    if: contains(github.ref, '/tags/v')
    permissions:
      contents: write
      actions: write
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: read release notes from annotated tag
        id: release_notes
        shell: bash
        run: |
          tag_message="$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}")"
          if [ -z "$tag_message" ]; then
            echo "Annotated tag message is required for release notes." >&2
            exit 1
          fi

          notes_file="${RUNNER_TEMP}/release-notes.md"
          printf '%s\n' "$tag_message" > "$notes_file"
          echo "path=${notes_file}" >> "$GITHUB_OUTPUT"
      - name: create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES_FILE: ${{ steps.release_notes.outputs.path }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "ytdl-material ${GITHUB_REF_NAME}" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "ytdl-material ${GITHUB_REF_NAME}" \
              --notes-file "$NOTES_FILE" \
              --verify-tag
          fi
      - name: download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ytdl-material
          path: ${{runner.temp}}/ytdl-material
      - name: prepare release asset
        shell: pwsh
        run: Compress-Archive -Path "$env:RUNNER_TEMP/ytdl-material" -DestinationPath "ytdl-material-$env:GITHUB_REF_NAME.zip"
      - name: upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "./ytdl-material-${GITHUB_REF_NAME}.zip" \
            "./docker-compose.yml#docker-compose.yml" \
            --clobber
      - name: dispatch docker release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run docker-release.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f tags="$GITHUB_REF_NAME" -f publish_latest=true
