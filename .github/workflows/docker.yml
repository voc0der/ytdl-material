name: docker

on:
  # Publishing nightly is a deliberate step, like a release, so automated merges to main
  # never ship an image on their own.
  workflow_dispatch:
    inputs:
      cold_rebuild:
        description: 'Rebuild without the layer cache'
        type: boolean
        default: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: Set hash
        id: vars
        run: echo "::set-output name=sha_short::$(git rev-parse --short HEAD)"

      - name: Get current date
        id: date
        run: echo "::set-output name=date::$(date +'%Y-%m-%d')"

      - name: create-json
        id: create-json
        uses: jsdaniell/create-json@v1.2.3
        with:
          name: "version.json"
          json: '{"type": "docker", "tag": "${{secrets.DOCKERHUB_MASTER_TAG}}", "commit": "${{ steps.vars.outputs.sha_short }}", "date": "${{ steps.date.outputs.date }}"}'
          dir: 'backend/'

      - name: setup platform emulator
        uses: docker/setup-qemu-action@v4

      - name: setup multi-arch docker build
        uses: docker/setup-buildx-action@v4

      - name: Generate Docker image metadata
        id: docker-meta
        uses: docker/metadata-action@v6
        # Defaults:
        #     DOCKERHUB_USERNAME  : voc0der
        #     DOCKERHUB_REPO      : ytdl-material
        #     DOCKERHUB_MASTER_TAG: nightly
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPO }}
            ghcr.io/${{ github.repository_owner }}/${{ secrets.DOCKERHUB_REPO }}
          tags: |
            type=raw,${{secrets.DOCKERHUB_MASTER_TAG}}-{{ date 'YYYY-MM-DD' }}
            type=raw,${{secrets.DOCKERHUB_MASTER_TAG}}
            type=sha,prefix=sha-,format=short

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build & push images
        if: ${{ !inputs.cold_rebuild }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64/v8
          cache-from: type=gha,scope=docker-main
          cache-to: type=gha,mode=max,scope=docker-main
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}

      - name: build & push images (cold rebuild)
        if: ${{ inputs.cold_rebuild }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64/v8
          no-cache: true
          cache-to: type=gha,mode=max,scope=docker-main
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
