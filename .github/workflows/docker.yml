name: docker

on:
  # Nightly is built once a night, and only when main has moved since the last build, so
  # automated merges during the day never ship an image on their own. 07:00 UTC is 3am US
  # Eastern in summer and 2am in winter.
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      cold_rebuild:
        description: 'Rebuild without the layer cache'
        type: boolean
        default: false

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - name: Compare with the last nightly build
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last_sha=$(gh run list -R "${{ github.repository }}" --workflow docker.yml --branch main \
            --status success --limit 1 --json headSha -q '.[0].headSha // ""')
          if [ "$last_sha" = "${{ github.sha }}" ]; then
            echo "main is still at ${last_sha}, which nightly was last built from."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "main moved from ${last_sha:-nothing} to ${{ github.sha }}."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: changes
    # A manual run always builds; the nightly schedule only builds when main has moved.
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set hash
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: create-json
        id: create-json
        uses: jsdaniell/create-json@938ec496e0f6d88bccb05409cbc40a23a7697337 # v1.2.4
        with:
          name: "version.json"
          json: '{"type": "docker", "tag": "${{secrets.DOCKERHUB_MASTER_TAG}}", "commit": "${{ steps.vars.outputs.sha_short }}", "date": "${{ steps.date.outputs.date }}"}'
          dir: 'backend/'

      - name: setup platform emulator
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: setup multi-arch docker build
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Generate Docker image metadata
        id: docker-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        # Defaults:
        #     DOCKERHUB_USERNAME  : voc0der
        #     DOCKERHUB_REPO      : ytdl-material
        #     DOCKERHUB_MASTER_TAG: nightly
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPO }}
            ghcr.io/${{ github.repository_owner }}/${{ secrets.DOCKERHUB_REPO }}
          tags: |
            type=raw,${{secrets.DOCKERHUB_MASTER_TAG}}-{{ date 'YYYY-MM-DD' }}
            type=raw,${{secrets.DOCKERHUB_MASTER_TAG}}
            type=sha,prefix=sha-,format=short

      - name: Login to DockerHub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build & push images
        if: ${{ !inputs.cold_rebuild }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64/v8
          cache-from: type=gha,scope=docker-main
          cache-to: type=gha,mode=max,scope=docker-main
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}

      - name: build & push images (cold rebuild)
        if: ${{ inputs.cold_rebuild }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64/v8
          no-cache: true
          cache-to: type=gha,mode=max,scope=docker-main
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
