name: docker

on:
  # Nightly is built once a night, and only when main has moved since the last build, so
  # automated merges during the day never ship an image on their own. 07:00 UTC is 3am US
  # Eastern in summer and 2am in winter.
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      cold_rebuild:
        description: 'Rebuild without the layer cache'
        type: boolean
        default: false

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - name: Compare with the last nightly build
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last_sha=$(gh run list -R "${{ github.repository }}" --workflow docker.yml --branch main \
            --status success --limit 1 --json headSha -q '.[0].headSha // ""')
          if [ "$last_sha" = "${{ github.sha }}" ]; then
            echo "main is still at ${last_sha}, which nightly was last built from."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "main moved from ${last_sha:-nothing} to ${{ github.sha }}."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: changes
    # A manual run always builds; the nightly schedule only builds when main has moved.
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: Set hash
        id: vars
        run: echo "::set-output name=sha_short::$(git rev-parse --short HEAD)"

      - name: Get current date
        id: date
        run: echo "::set-output name=date::$(date +'%Y-%m-%d')"

      - name: create-json
        id: create-json
        uses: jsdaniell/create-json@v1.2.3
        with:
          name: "version.json"
          json: '{"type": "docker", "tag": "${{secrets.DOCKERHUB_MASTER_TAG}}", "commit": "${{ steps.vars.outputs.sha_short }}", "date": "${{ steps.date.outputs.date }}"}'
          dir: 'backend/'

      - name: setup platform emulator
        uses: docker/setup-qemu-action@v4

      - name: setup multi-arch docker build
        uses: docker/setup-buildx-action@v4

      - name: Generate Docker image metadata
        id: docker-meta
        uses: docker/metadata-action@v6
        # Defaults:
        #     DOCKERHUB_USERNAME  : voc0der
        #     DOCKERHUB_REPO      : ytdl-material
        #     DOCKERHUB_MASTER_TAG: nightly
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPO }}
            ghcr.io/${{ github.repository_owner }}/${{ secrets.DOCKERHUB_REPO }}
          tags: |
            type=raw,${{secrets.DOCKERHUB_MASTER_TAG}}-{{ date 'YYYY-MM-DD' }}
            type=raw,${{secrets.DOCKERHUB_MASTER_TAG}}
            type=sha,prefix=sha-,format=short

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build & push images
        if: ${{ !inputs.cold_rebuild }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64/v8
          cache-from: type=gha,scope=docker-main
          cache-to: type=gha,mode=max,scope=docker-main
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}

      - name: build & push images (cold rebuild)
        if: ${{ inputs.cold_rebuild }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64/v8
          no-cache: true
          cache-to: type=gha,mode=max,scope=docker-main
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
