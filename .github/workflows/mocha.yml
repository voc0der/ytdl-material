name: Tests
'on':
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  test:
    name: 'Backend - mocha'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node:
          - 24
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '${{ matrix.node }}'
      - uses: actions/checkout@v7
      - name: 'Cache node_modules'
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-v${{ matrix.node }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-v${{ matrix.node }}-
          working-directory: ./backend
      # Same BtbN build as the Docker image (docker-utils/ffmpeg-fetch.sh), so bump both
      # together. It has to be a GPL build: the tests encode with libx264.
      - name: Install ffmpeg
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ffmpeg.tar.xz" \
            --connect-timeout 5 \
            --max-time 300 \
            --retry 5 \
            --retry-max-time 120 \
            --retry-all-errors \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-linux64-gpl-shared-9.0.tar.xz
          mkdir "$RUNNER_TEMP/ffmpeg"
          tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP/ffmpeg" --strip-components=1
          "$RUNNER_TEMP/ffmpeg/bin/ffmpeg" -hide_banner -version
          "$RUNNER_TEMP/ffmpeg/bin/ffprobe" -hide_banner -version >/dev/null
          echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"
      - name: Install Dependencies
        run: npm install
        working-directory: ./backend
      - name: Run All Node.js Tests
        run: npm run test
        working-directory: ./backend

  frontend:
    name: 'Frontend - vitest'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      # The build job type-checks the app project only, so a type error confined to a spec
      # would otherwise reach main unnoticed.
      - name: Type-check specs
        run: npx tsc -p src/tsconfig.spec.json --noEmit
      - name: Test browser extension
        run: npm run test:extension
      # Vitest runs in jsdom, so unlike the old karma suite this needs no browser.
      - name: Run Frontend Tests
        run: npm run test:headless
