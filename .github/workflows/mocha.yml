name: Tests
'on':
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  test:
    name: 'Backend - mocha'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node:
          - 24
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '${{ matrix.node }}'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Cache node_modules'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-v${{ matrix.node }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-v${{ matrix.node }}-
          working-directory: ./backend
      # BtbN's master build never needs a version bump. It has to be a GPL build: the
      # tests encode with libx264.
      - name: Install ffmpeg
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ffmpeg.tar.xz" \
            --connect-timeout 5 \
            --max-time 300 \
            --retry 5 \
            --retry-max-time 120 \
            --retry-all-errors \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl-shared.tar.xz
          mkdir "$RUNNER_TEMP/ffmpeg"
          tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP/ffmpeg" --strip-components=1
          "$RUNNER_TEMP/ffmpeg/bin/ffmpeg" -hide_banner -version
          "$RUNNER_TEMP/ffmpeg/bin/ffprobe" -hide_banner -version >/dev/null
          echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"
      - name: Install Dependencies
        run: npm install
        working-directory: ./backend
      - name: Run All Node.js Tests
        run: npm run test
        working-directory: ./backend

  frontend:
    name: 'Frontend - vitest'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      # The build job type-checks the app project only, so a type error confined to a spec
      # would otherwise reach main unnoticed.
      - name: Type-check specs
        run: npx tsc -p src/tsconfig.spec.json --noEmit
      - name: Test browser extension
        run: npm run test:extension
      # Vitest runs in jsdom, so unlike the old karma suite this needs no browser.
      - name: Run Frontend Tests
        run: npm run test:headless
