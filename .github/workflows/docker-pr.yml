name: docker-pr

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push image to registry'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      image_tag:
        description: 'Docker image tag (e.g., test, pr-13)'
        required: true
        default: 'test'
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set hash
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
      - name: create-json
        id: create-json
        uses: jsdaniell/create-json@938ec496e0f6d88bccb05409cbc40a23a7697337 # v1.2.4
        with:
          name: "version.json"
          json: '{"type": "docker", "tag": "nightly", "commit": "${{ steps.vars.outputs.sha_short }}", "date": "${{ steps.date.outputs.date }}"}'
          dir: 'backend/'
      - name: setup multi-arch docker build
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set push and tag values
        id: build_params
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_IMAGE: ${{ github.event.inputs.push_image }}
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          OWNER: ${{ github.repository_owner }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "push=$PUSH_IMAGE" >> "$GITHUB_OUTPUT"
            if [ "$PUSH_IMAGE" = "true" ]; then
              echo "tags=$DOCKERHUB_USERNAME/ytdl-material:$IMAGE_TAG,ghcr.io/$OWNER/ytdl-material:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
            else
              echo "tags=ytdl-material:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$PR_AUTHOR" = "voc0der" ]; then
            PR_TAG="pr-$PR_NUMBER"
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "tags=$DOCKERHUB_USERNAME/ytdl-material:${PR_TAG},ghcr.io/$OWNER/ytdl-material:${PR_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "tags=ytdl-material:nightly-pr-$PR_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to DockerHub
        if: steps.build_params.outputs.push == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: steps.build_params.outputs.push == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build & push images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          cache-from: type=gha,scope=docker-pr
          cache-to: type=gha,mode=max,scope=docker-pr
          push: ${{ steps.build_params.outputs.push }}
          tags: ${{ steps.build_params.outputs.tags }}
