name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 12 * * 6'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript']

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Initialize CodeQL
      uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        languages: ${{ matrix.language }}

    - name: Autobuild
      uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

    # Waits until code scanning has processed the results, so the alerts below are current.
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

    # Fails while any CodeQL alert is open on the ref just analyzed (for a pull request, its
    # merge result). An alert reviewed and dismissed in code scanning, with the reason in its
    # comment, no longer counts.
    - name: Fail on open alerts
      env:
        GH_TOKEN: ${{ github.token }}
        REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.ref }}
      run: |
        alerts="$(gh api --paginate "repos/$GITHUB_REPOSITORY/code-scanning/alerts?ref=$REF&state=open&tool_name=CodeQL&per_page=100" \
          --jq '.[] | "\(.rule.id) \(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line) \(.html_url)"')"
        if [ -n "$alerts" ]; then
          printf '%s\n' "$alerts"
          echo "::error::CodeQL has open alerts on $REF. Fix them, or dismiss a reviewed false positive in code scanning with the reason."
          exit 1
        fi
        echo "No open CodeQL alerts on $REF."
