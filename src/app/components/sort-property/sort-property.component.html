<app-picker [title]="title" [options]="propertyOptions" [value]="sortProperty" (valueChange)="emitSortOptionChanged($any($event))"
  [segments]="currentOrderOptions" [segment]="currentOrder" [segmentsTitle]="orderTitle" (segmentChange)="orderChanged($event)"
  [icon]="icon" [iconOnly]="iconOnly"></app-picker>
