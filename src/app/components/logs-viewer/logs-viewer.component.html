<div class="logs">
  <div class="logs-toolbar kit-rail kit-rail-wrap">
    <app-picker [title]="linesLabel" [label]="linesLabel" [options]="lineOptions" [value]="requested_lines"
      (valueChange)="linesChanged($any($event))"></app-picker>
    <span class="logs-spacer"></span>
    <button type="button" class="kit-icon-button" [cdkCopyToClipboard]="logs_text" (click)="copiedLogsToClipboard()"
      matTooltip="Copy logs" i18n-matTooltip="Copy logs button" aria-label="Copy logs" i18n-aria-label="Copy logs button">
      <mat-icon>content_copy</mat-icon>
    </button>
    <button type="button" class="kit-chip kit-danger" (click)="clearLogs()">
      <mat-icon>delete_sweep</mat-icon><span i18n="Clear logs button">Clear logs</span>
    </button>
  </div>

  @if (logs_loading) {
    <div class="list-loading" aria-busy="true">
      <mat-spinner [diameter]="32"></mat-spinner>
    </div>
  } @else if (!logs || logs.length === 0) {
    <p class="settings-empty" i18n="No logs text">Nothing has been logged yet.</p>
  } @else {
    <div class="log-box logs-output" role="log" tabindex="0">
      @for (log of logs; track $index) {
        <div class="log-line" [attr.data-level]="log.level">{{log.text}}</div>
      }
    </div>
  }
</div>
