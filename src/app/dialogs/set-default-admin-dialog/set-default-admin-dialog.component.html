<header class="dialog-header">
  <span class="dialog-symbol" aria-hidden="true"><mat-icon>admin_panel_settings</mat-icon></span>
  <div class="dialog-heading">
    <h2 mat-dialog-title class="dialog-title" i18n="Create admin account dialog title">Create admin account</h2>
    <p class="dialog-subtitle" i18n="Create admin account subtitle">The user name is <strong>admin</strong>.</p>
  </div>
</header>

<mat-dialog-content class="dialog-content">
  <p class="dialog-hint" i18n="No default admin detected explanation">No admin account exists yet. Give it a password and it is created for you.</p>
  <label class="dialog-field dialog-field-wide">
    <span class="dialog-field-label" i18n="Password">Password</span>
    <span class="kit-field"><input type="password" autocomplete="new-password" [(ngModel)]="input" (keyup.enter)="create()"></span>
  </label>
</mat-dialog-content>

<mat-dialog-actions class="dialog-actions">
  @if (creating) {
    <mat-spinner class="dialog-actions-spinner" [diameter]="20"></mat-spinner>
  }
  <button type="button" class="kit-chip kit-primary dialog-actions-end" [disabled]="input.length === 0 || creating" (click)="create()">
    <ng-container i18n="Create">Create</ng-container>
  </button>
</mat-dialog-actions>
